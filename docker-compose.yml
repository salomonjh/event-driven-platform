services:
  event-service:
    build: ./services/event-service
    container_name: event-service
    ports:
      - "3000:3000"
    env_file:
      - ./services/event-service/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/event-service:/app
      - /app/node_modules
    command: npm run dev

  notification-worker:
    build: ./services/notification-worker
    container_name: notification-worker
    env_file:
      - ./services/notification-worker/.env.example
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/notification-worker:/app
    command: npm run dev

  postgres:
    image: postgres:16.7
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:8.2
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
