openapi: 3.1.0
info:
  title: Event Service API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      description: Returns the API and DB status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  db:
                    type: string
                  timestamp:
                    type: string
